<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Raffle Sign Up</title>
  <script type="module" src="js/signup.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-r from-purple-400 via-pink-500 to-red-500 flex items-center justify-center min-h-screen">
  <div class="bg-white p-10 rounded-xl shadow-lg max-w-md w-full">
    <h1 class="text-2xl font-bold mb-4">Enter the Raffle</h1>
    <form id="signup-form" class="space-y-4">
      <input type="text" id="name" placeholder="Your Name" class="w-full p-2 border border-gray-300 rounded" required />
      <input type="email" id="email" placeholder="Your Email" class="w-full p-2 border border-gray-300 rounded" required />
      <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded">Enter</button>
    </form>
  </div>
</body>
</html>
